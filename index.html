<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Marketplace</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f2f5;
}

header {
  background: #1877f2;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.card-content {
  padding: 10px;
}

.title {
  font-weight: bold;
}

.price {
  color: green;
  margin: 5px 0;
}

button {
  width: 100%;
  padding: 8px;
  background: #25D366;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #1da851;
}
</style>
</head>

<body>

<header>Mini Marketplace</header>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300">
    <div class="card-content">
      <div class="title">Sepatu Keren</div>
      <div class="price">Rp 250.000</div>
      <button onclick="chat()">Chat Penjual</button>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300">
    <div class="card-content">
      <div class="title">Hoodie Stylish</div>
      <div class="price">Rp 180.000</div>
      <button onclick="chat()">Chat Penjual</button>
    </div>
  </div>

</div>

<script>
function chat() {
  window.open("https://wa.me/6281234567890", "_blank");
}
</script>

</body>
        </html>
